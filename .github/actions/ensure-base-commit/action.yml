name: Ensure base commit
description: Ensure a shallow checkout has enough history to diff against a base SHA.
inputs:
  base-sha:
    description: Base commit SHA to diff against.
    required: true
  fetch-ref:
    description: Branch or ref to deepen/fetch from origin when base-sha is missing.
    required: true
  require-history:
    description: Require complete comparison history for guards that inspect introductions.
    default: "false"
  policy-ledger-path:
    description: Hydrate the pre-policy snapshot when this ledger is absent at the comparison base.
    default: ""
  ratchet-renames:
    description: Hydrate bounded historical assertion/timeout rename candidate pools.
    default: "false"
  history-paths:
    description: Newline-separated metadata paths whose historical blobs the guard reads.
    default: ""
runs:
  using: composite
  steps:
    - name: Ensure base commit is available
      shell: bash
      env:
        BASE_ACTION_PATH: ${{ github.action_path }}
        BASE_SHA: ${{ inputs.base-sha }}
        FETCH_REF: ${{ inputs.fetch-ref }}
        REQUIRE_HISTORY: ${{ inputs.require-history }}
        POLICY_LEDGER_PATH: ${{ inputs.policy-ledger-path }}
        RATCHET_RENAMES: ${{ inputs.ratchet-renames }}
        HISTORY_PATHS: ${{ inputs.history-paths }}
      run: |
        set -euo pipefail
        python_command=python3
        if [ "$RUNNER_OS" = "Windows" ]; then
          python_command=python
        fi
        exec "$python_command" -I -S "$BASE_ACTION_PATH/../git-owner/owner.py" \
          --policy "$BASE_ACTION_PATH/policy.py"
